      state.students.forEach(s=>{if(map.has(s.group))map.get(s.group).push(s);else loose.push(s)});
      loose.forEach(s=>{const target=names.map(name=>map.get(name)).sort((a,b)=>a.length-b.length)[0];target.push(s)});
      return names.map(name=>({name,members:map.get(name).slice().sort((a,b)=>avgScore(b)-avgScore(a))}));
    }
    function moveStudentToGroup(id,name){
      const s=state.students.find(x=>x.id===id);if(!s||!name)return;
      if(s.group===name)return;
      s.group=name;save();renderPage();toast("已将 "+s.name+" 调整至"+name);
    }
    function applyGroupSize(){
      const input=el("groupSizeInput"),size=Math.max(1,Math.min(30,Number(input&&input.value)||5));
      if(!state.students.length)return toast("请先添加学生");
      if(!confirm("将按每组 "+size+" 人对全班重新分组（兼顾性别与成绩均衡），确定继续？"))return;
      autoRegroup(size);
    }
    function autoRegroup(size){
      const n=Math.max(1,Math.min(30,Number(size)||5));
      state.groupConfig=Object.assign({},state.groupConfig||{},{size:n});
      const total=state.students.length;
      if(!total){save();renderPage();return}
      const count=Math.max(1,Math.ceil(total/n)),names=Array.from({length:count},(_,i)=>"第"+(i+1)+"学习小组");
      const male=state.students.filter(s=>s.gender!=="女").sort((a,b)=>avgScore(b)-avgScore(a));
      const female=state.students.filter(s=>s.gender==="女").sort((a,b)=>avgScore(b)-avgScore(a));
      const pool=[];let mi=0,fi=0;const startWithMale=Math.random()<0.5;
      while(mi<male.length||fi<female.length){
        if(startWithMale){if(mi<male.length)pool.push(male[mi++]);if(fi<female.length)pool.push(female[fi++])}
        else{if(fi<female.length)pool.push(female[fi++]);if(mi<male.length)pool.push(male[mi++])}
      }
      const buckets=Array.from({length:count},()=>[]);
      pool.forEach((s,k)=>{const round=Math.floor(k/count),pos=round%2===0?k%count:count-1-(k%count);buckets[pos].push(s)});
      buckets.forEach((list,i)=>list.forEach(s=>{s.group=names[i]}));
      save();renderPage();toast("已按每组 "+n+" 人重新分为 "+count+" 个学习小组");
    }

        function deskSlots(config=state.seatConfig){

    function repairSeatRules(order,slots,mode,config){

    function buildSeatArrangement(mode="random"){

      if(!state.students.length||!cols||!rows)return {order:Array(Math.max(0,cap)).fill(null),broken:0,oversize:0};
      const slots=deskSlots(config),pairDesks=slots.filter(slot=>slot.length===2),oneDesks=slots.filter(slot=>slot.length===1);
      const isSingle=config.mode==="single",grouped=seatUnits(),units=grouped.units;

      units.filter(unit=>unit.length===1).forEach(unit=>singles.push(unit[0]));
      const plan=[];
      forcedPairs.forEach(unit=>{if(plan.length<pairDesks.length)plan.push(unit);else{singles.push(unit[0]);singles.push(unit[1])}});
      const need2=Math.max(0,pairDesks.length-plan.length);

      rest.forEach(student=>plan.push([student]));

      else{for(let i=1;i<cfg.groups;i++)aisles.push(i*cfg.colsPerGroup)}
      const aisleSet=new Set(aisles),physical=[];
      for(let c=0;c<cols;c++){if(aisleSet.has(c))physical.push({type:"aisle"});physical.push({type:"seat",seatCol:c})}
      const nameAt=(pr,pc)=>{const id=state.seatOrder[seatVisualIndex(pr,pc,cfg)];return state.students.find(s=>s.id===id)?.name||""};
      const tailEmpty=(pr,pc)=>{for(let r=pr+1;r<rows;r++)if(nameAt(r,pc))return false;return true};
      return {cfg,cols,rows,physical,nameAt,tailEmpty,totalCols:physical.length};
    }
    function safeExportName(name){return String(name||"座位表").replace(/[\\/:*?"<>|]/g,"_")}
    function saveExportBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
    async function exportSeatWord(){
      if(typeof docx==="undefined"){toast("Word 导出组件尚未加载，请联网刷新后重试");return}
      const L=seatExportLayout(),cfg=L.cfg;
      const {Document,Packer,Paragraph,Table,TableRow,TableCell,TextRun,WidthType,AlignmentType,BorderStyle,PageOrientation,HeightRule,VerticalAlign}=docx;
      const border={style:BorderStyle.SINGLE,size:4,color:"000000"},none={style:BorderStyle.NONE,size:0,color:"FFFFFF"};
      const bordered={top:border,bottom:border,left:border,right:border},borderless={top:none,bottom:none,left:none,right:none};
      const margins={top:0,left:108,bottom:0,right:108},para=(text,size)=>new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text,font:"宋体",size})]});
      const blankCell=()=>new TableCell({children:[new Paragraph({children:[]})],verticalAlign:VerticalAlign.CENTER,borders:borderless,margins});
      const seatCell=(text,hasBorder=true,span=1)=>new TableCell({children:[para(text,40)],columnSpan:span,verticalAlign:VerticalAlign.CENTER,borders:hasBorder?bordered:borderless,margins});
      const fullRow=(text,size,height)=>new TableRow({height:{value:height,rule:HeightRule.ATLEAST},children:[new TableCell({children:[para(text,size)],columnSpan:L.totalCols,verticalAlign:VerticalAlign.CENTER,borders:borderless,margins})]});
      const titleRow=fullRow("座位表",52,1000),podiumRow=fullRow("【 讲 台 】",40,1000);
      let groupRow=null;
      if(cfg.mode!=="single"){
        const cells=[];
        for(let g=0;g<cfg.groups;g++){
          if(g)cells.push(blankCell());
          cells.push(seatCell("第"+(cfg.flipH?cfg.groups-g:g+1)+"大组",true,cfg.colsPerGroup));
        }
        groupRow=new TableRow({height:{value:760,rule:HeightRule.ATLEAST},children:cells});
      }
      const seatRows=[];
      for(let pr=0;pr<L.rows;pr++){
        const cells=L.physical.map(p=>p.type==="aisle"?blankCell():seatCell(L.nameAt(pr,p.seatCol),!L.tailEmpty(pr,p.seatCol)));
        seatRows.push(new TableRow({height:{value:760,rule:HeightRule.ATLEAST},children:cells}));
      }
      const finalRows=cfg.podium==="bottom"?[titleRow,...seatRows,...(groupRow?[groupRow]:[]),podiumRow]:[titleRow,podiumRow,...(groupRow?[groupRow]:[]),...seatRows];
      let widths=L.physical.map(p=>p.type==="seat"?1728:271);const tableWidth=14620,rawWidth=widths.reduce((a,b)=>a+b,0);
      if(rawWidth>tableWidth)widths=widths.map(w=>Math.max(80,Math.round(w*tableWidth/rawWidth)));
      const diff=tableWidth-widths.reduce((a,b)=>a+b,0);
      widths[widths.length-1]+=diff;
      try{
        const documentFile=new Document({sections:[{properties:{page:{size:{width:11906,height:16838,orientation:PageOrientation.LANDSCAPE},margin:{top:850,bottom:850,left:1134,right:1134}}},children:[new Table({rows:finalRows,width:{size:tableWidth,type:WidthType.DXA},columnWidths:widths,indent:{size:88,type:WidthType.DXA}})]}]});
        saveExportBlob(await Packer.toBlob(documentFile),safeExportName(cfg.name)+".docx");
        toast("Word 座位表已按附件版式导出");
      }catch(error){console.error(error);toast("Word 导出失败，请刷新后重试")}
    }
    function exportSeatExcel(){
      if(typeof XLSX==="undefined"){toast("Excel 导出组件尚未加载，请联网刷新后重试");return}
      const L=seatExportLayout(),cfg=L.cfg,FONT="宋体";
      const thin={style:"thin",color:{rgb:"000000"}},none={style:"none"};
      const all={top:thin,bottom:thin,left:thin,right:thin},noBorder={top:none,bottom:none,left:none,right:none};
      const style=(size,border)=>({font:{name:FONT,sz:size,color:{rgb:"000000"}},alignment:{horizontal:"center",vertical:"center"},border});
      const sTitle=style(26,noBorder),sPodium=style(20,noBorder),sGroup=style(20,all),sSeat=style(20,all),sEmpty=style(20,noBorder),sAisle=style(20,noBorder);
      const rowDefs=[],mergeDefs=[];
      const addRow=(values,styles,height,kind="")=>rowDefs.push({values,styles,height,kind});
      addRow(["座位表",...Array(L.totalCols-1).fill("")],Array(L.totalCols).fill(sTitle),50,"title");
      const podium=()=>addRow(["【 讲 台 】",...Array(L.totalCols-1).fill("")],Array(L.totalCols).fill(sPodium),50,"podium");
      const groups=()=>{
        const values=Array(L.totalCols).fill(""),styles=Array(L.totalCols).fill(sAisle);
        for(let g=0;g<cfg.groups;g++){
          const seatStart=g*cfg.colsPerGroup,start=L.physical.findIndex(p=>p.type==="seat"&&p.seatCol===seatStart);
          values[start]="第"+(cfg.flipH?cfg.groups-g:g+1)+"大组";
          for(let c=start;c<start+cfg.colsPerGroup;c++)styles[c]=sGroup;
        }
        addRow(values,styles,38,"groups");
      };
      const seats=()=>{for(let pr=0;pr<L.rows;pr++){const values=[],styles=[];L.physical.forEach(p=>{if(p.type==="aisle"){values.push("");styles.push(sAisle)}else{const name=L.nameAt(pr,p.seatCol);values.push(name);styles.push(name||!L.tailEmpty(pr,p.seatCol)?sSeat:sEmpty)}});addRow(values,styles,50)}};
      if(cfg.podium==="top"){podium();if(cfg.mode!=="single")groups();seats()}
      else{seats();if(cfg.mode!=="single")groups();podium()}
      rowDefs.forEach((row,r)=>{
        if(row.kind==="title"||row.kind==="podium")mergeDefs.push({s:{r,c:0},e:{r,c:L.totalCols-1}});
        if(row.kind==="groups")for(let g=0;g<cfg.groups;g++){const start=L.physical.findIndex(p=>p.type==="seat"&&p.seatCol===g*cfg.colsPerGroup);if(cfg.colsPerGroup>1)mergeDefs.push({s:{r,c:start},e:{r,c:start+cfg.colsPerGroup-1}})}
      });
      try{
        const ws=XLSX.utils.aoa_to_sheet([]);
        rowDefs.forEach((row,r)=>row.values.forEach((value,c)=>{ws[XLSX.utils.encode_cell({r,c})]={t:"s",v:value,s:row.styles[c]}}));
        ws["!rows"]=rowDefs.map(r=>({hpt:r.height}));
        ws["!cols"]=L.physical.map(p=>p.type==="seat"?{wch:12.5}:{wch:2.5});
        ws["!merges"]=mergeDefs;
        ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rowDefs.length-1,c:L.totalCols-1}});
        ws["!margins"]={left:.5,right:.5,top:.5,bottom:.5,header:.3,footer:.3};
        ws["!page"]={orientation:"landscape",paperSize:9,fitToWidth:1,fitToHeight:1};
        const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"座位表");
        XLSX.writeFile(wb,safeExportName(cfg.name)+".xlsx",{cellStyles:true});
        toast("Excel 座位表已按附件版式导出");
      }catch(error){console.error(error);toast("Excel 导出失败，请刷新后重试")}
    }
    function downloadDormTemplate(){
      const rows=[["姓名","学号","宿舍","床位"],["张三","G2026001","A301",1]];
      if(typeof XLSX!=="undefined"){const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:14},{wch:16},{wch:12},{wch:10}];XLSX.utils.book_append_sheet(wb,ws,"床位安排模板");XLSX.writeFile(wb,"宿舍床位安排导入模板.xlsx");toast("Excel 模板已下载");return}
      downloadBlob(`<html><body>${tableHTML(rows[0],rows.slice(1))}</body></html>`,"application/vnd.ms-excel","宿舍床位安排导入模板.xls");
    }
    function exportDormExcel(){
      const rows=[["姓名","性别","学号","宿舍","床位"],...state.students.map(s=>[s.name,s.gender,s.studentNo,s.dorm,s.bed||""])];
      if(typeof XLSX!=="undefined"){const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:14},{wch:8},{wch:16},{wch:12},{wch:10}];XLSX.utils.book_append_sheet(wb,ws,"宿舍安排");XLSX.writeFile(wb,safeExportName(state.classInfo.name)+"宿舍安排.xlsx");toast("宿舍名单已导出");return}
      downloadBlob(`<html><body>${tableHTML(rows[0],rows.slice(1))}</body></html>`,"application/vnd.ms-excel","宿舍安排表.xls");
    }
    function exportPointsExcel(){downloadBlob(`<html><body>${tableHTML(["日期","学生","类型","事项","分值","录入人"],state.pointsRecords.map(r=>[r.date,r.student,r.type,r.item,r.score,r.operator]))}</body></html>`,"application/vnd.ms-excel","德育积分明细.xls")}
    function exportCurrentComment(){const s=state.students.find(x=>x.id===state.selectedCommentStudent);downloadWord(s.name+"期末评语",`<h1>${s.name}期末评语</h1><p>${escapeHtml(state.commentDraft)}</p>`,s.name+"期末评语.doc")}
    function exportAllComments(){if(!state.comments.length)return toast("还没有已保存的评语");downloadWord(state.classInfo.name+"期末评语",`<h1>${escapeHtml(state.classInfo.name)}期末评语</h1>${state.comments.map(c=>{const s=state.students.find(x=>x.id===c.studentId);return `<h3>${s?.name||"学生"}</h3><p>${escapeHtml(c.text)}</p>`}).join("")}`,safeExportName(state.classInfo.name)+"期末评语.doc")}
    function exportFootprints(){downloadWord("班主任工作留痕",`<h1>班主任工作留痕</h1>${state.footprints.map(x=>`<h3>${x.date}　${escapeHtml(x.title)}</h3><p>类型：${x.type}　学生：${x.student}</p><p>${escapeHtml(x.detail)}</p>`).join("")}`,"班主任工作留痕.doc")}
    function init(){renderNav();renderPage()}
    init();
  </script>
