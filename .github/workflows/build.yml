# .github/workflows/build.yml
#
# 原先使用 reuixiy/hugo-deploy@v1：它基于 archlinux 镜像 `pacman -Syu hugo`，
# 每次都会装到最新 Hugo。2026-11-20 拉到 hugo v0.170.1（非 extended），
# 该版本移除了 libsass，MemE 主题的 `toCSS` 因缺少 dart-sass 二进制而失败：
#   error calling toCSS: no Dart Sass binary found in $PATH
# 因此这里改为固定 Hugo 0.169.0 extended（最后一次构建成功的版本），
# 并保留原来的部署方式：把 public/ 强推到部署仓库的 build 分支。

name: build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.169.0
      TZ: Asia/Shanghai

    steps:
      - name: Checkout source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # enableGitInfo = true，需要完整历史
          fetch-depth: 0

      - name: Install pinned Hugo (extended)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version | grep -q "v${HUGO_VERSION}" || {
            echo "unexpected hugo version"; exit 1;
          }

      - name: Build site
        run: hugo --gc --minify --cleanDestinationDir

      - name: Deploy to huangdiv/huangdiv.github.io@build
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          # 保留中文路径的原始字节（MemE 主题 issue #27）
          git config --global core.quotePath false
          cd public
          git init -q
          git add -A
          git commit -q -m "Automated deployment @ $(date '+%Y-%m-%d %H:%M:%S') ${TZ} (${GITHUB_SHA::7})"
          git remote add origin "git@github.com:huangdiv/huangdiv.github.io.git"
          git push -f origin "HEAD:build"
          rm -f ~/.ssh/id_rsa
